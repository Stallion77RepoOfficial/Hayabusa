# Meson cross file for building rizin (and rz-ghidra) against the same NDK
# toolchain the hayabusa binary itself is built with, so the static archives
# link without ABI surprises.
#
# Put the selected NDK prebuilt bin directory on PATH before invoking Meson.
# Keeping host-specific absolute paths out of this file makes the same cross
# definition usable on macOS and Linux. Modern NDKs no longer ship the old
# aarch64-linux-android-{as,ld,ranlib,strip} wrappers, so use llvm-* directly.

[binaries]
c         = 'aarch64-linux-android36-clang'
cpp       = 'aarch64-linux-android36-clang++'
ar        = 'llvm-ar'
ranlib    = 'llvm-ranlib'
strip     = 'llvm-strip'
ld        = 'ld.lld'
pkg-config = 'false'

[properties]
# Nothing runs on the host during the build, and anything that tries should
# fail loudly rather than silently testing the wrong machine.
needs_exe_wrapper = true

[host_machine]
system     = 'android'
cpu_family = 'aarch64'
cpu        = 'aarch64'
endian     = 'little'
